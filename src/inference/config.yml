device: cuda

dir:
  root: /home/hc0783@unt.ad.unt.edu/workspace/hicinterpolate/datasets/HiCInterpolate
  model_state: /home/hc0783@unt.ad.unt.edu/workspace/hicinterpolate/datasets/final_output/triplets_dataset
  output: /home/hc0783@unt.ad.unt.edu/workspace/hicinterpolate/datasets/final_output/test_dir
  data: /home/hc0783@unt.ad.unt.edu/workspace/hicinterpolate/datasets/triplets_dataset
  image: /home/hc0783@unt.ad.unt.edu/workspace/hicinterpolate/datasets/triplets_dataset

file:
  inference: /home/hc0783@unt.ad.unt.edu/workspace/hicinterpolate/datasets/triplets_dataset/test/test_25000_256.txt
  inference_raw: /home/hc0783@unt.ad.unt.edu/workspace/hicinterpolate/datasets/triplets_dataset/test/info.txt
  vgg_model: /home/hc0783@unt.ad.unt.edu/workspace/hicinterpolate/datasets/triplets_dataset/imagenet-vgg-verydeep-19.mat
  model: ${dir.model_state}/${model.name}_p${data.patch}_b${data.batch_size}.pt
  hic_map: ${dir.output}/${model.name}_inference_hic_map.jpg
  metrics: ${dir.output}/${model.name}_inference_metrics.txt
  log: ${dir.output}/${model.name}_inference.log

data:
  patch: 256
  interpolator_images_map:
    frame_0: img1.npy
    frame_1: img2.npy
    frame_2: img3.npy
  batch_size: 20

model:
  name: hicinterpolate_${data.patch}
  init_in_channels: 1
  init_out_channels: 4
  pyramid_level: 4
  ext_feature_level: 3
  unique_levels: 2
  flow:
    num_of_convs: [7, 5, 7]
    out_channels: [16, 32, 64]
  fusion_pyramid_level: 4

loss:
  weight_parameters:
    - name: mse
      boundaries: [100]
      values: [0.9, 0.8]
    - name: ssim
      boundaries: [100]
      values: [0.4, 0.6]
    - name: symmetry
      boundaries: [100]
      values: [1.0, 1.0]
    - name: vgg
      boundaries: [100]
      values: [0.005, 0.01]