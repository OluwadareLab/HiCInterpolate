device: cuda

dir:
  model_state: /home/hc0783.unt.ad.unt.edu/workspace/hicinterpolate/datasets/timeseries/output/hicinterpolate
  output: /home/hc0783.unt.ad.unt.edu/workspace/hicinterpolate/datasets/timeseries/output/hicinterpolate
  data: /home/hc0783.unt.ad.unt.edu/workspace/hicinterpolate/datasets/timeseries/new_triplets
  image: /home/hc0783.unt.ad.unt.edu/workspace/hicinterpolate/datasets/timeseries/new_triplets


file:
  dataset_dict: /home/hc0783.unt.ad.unt.edu/workspace/hicinterpolate/datasets/timeseries/new_triplets/train/25000_256
  snapshot: ${dir.model_state}/${model.name}_snapshot.pt
  model: ${dir.model_state}/${model.name}.pt
  test_hic_map: ${dir.output}/${model.name}_p${data.patch}_b${data.batch_size}_hic_map.jpg
  num_visualization_samples: 2
  val_metrics: ${dir.output}/${model.name}_p${data.patch}_b${data.batch_size}_val_metrics.csv
  psnr_val_plot: ${dir.output}/${model.name}_p${data.patch}_b${data.batch_size}_psnr_plot.png
  ssim_val_plot: ${dir.output}/${model.name}_p${data.patch}_b${data.batch_size}_ssim_plot.png
  hicrep_val_plot: ${dir.output}/${model.name}_p${data.patch}_b${data.batch_size}_hicrep_plot.png
  train_val_loss_plot: ${dir.output}/${model.name}_p${data.patch}_b${data.batch_size}_train_val_loss_plot.png
  lr_plot: ${dir.output}/${model.name}_p${data.patch}_b${data.batch_size}_lr_plot.png
  log: ${dir.output}/${model.name}_p${data.patch}_b${data.batch_size}.log

data:
  patch: 256
  resolution: 25000
  batch_size: 20
  interpolator_images_map:
    frame_0: img1.npy
    frame_1: img2.npy
    frame_2: img3.npy

training:
  epochs: 100
  save_every: 10
  lr: 1e-4
  min_lr: 1e-5
  weight_decay: 5e-5
  warmup_epochs: 3
  grad_clip: 1.0

model:
  name: hicinterpolate_${data.resolution}_${data.patch}

loss:
  weight_parameters:
    - name: l1
      boundaries: [0]
      values: [1.0]
    - name: ssim
      boundaries: [0]
      values: [1.0]

evaluation:
  monitor: ssim
  metrics:
    psnr: true
    ssim: true
    hicrep: true
