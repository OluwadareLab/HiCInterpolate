device: cuda

dir:
  root: /home/hc0783@unt.ad.unt.edu/workspace/hicinterpolate/HiCInterpolate
  model_state: /home/hc0783@unt.ad.unt.edu/workspace/hicinterpolate/datasets/output
  output: /home/hc0783@unt.ad.unt.edu/workspace/hicinterpolate/datasets/output/improved_curriculum
  data: /home/hc0783@unt.ad.unt.edu/workspace/hicinterpolate/datasets/triplates/5000/human
  image: ${dir.data}/${data.patch}


file:
  dataset_dict: ${dir.image}/dataset_dict.txt
  vgg_model: ${dir.data}/models/imagenet-vgg-verydeep-19.mat
  snapshot: ${dir.model_state}/${model.name}_snapshot.pt
  model: ${dir.model_state}/${model.name}.pt
  test_hic_map: ${dir.output}/${model.name}_hic_map.jpg
  num_visualization_samples: 2
  val_metrics: ${dir.output}/${model.name}_val_metrics.csv
  psnr_val_plot: ${dir.output}/${model.name}_psnr_plot.png
  ssim_val_plot: ${dir.output}/${model.name}_ssim_plot.png
  scc_val_plot: ${dir.output}/${model.name}_scc_plot.png
  pcc_val_plot: ${dir.output}/${model.name}_pcc_plot.png
  genome_disco_val_plot: ${dir.output}/${model.name}_genome_disco_plot.png
  ncc_val_plot: ${dir.output}/${model.name}_ncc_plot.png
  lpips_val_plot: ${dir.output}/${model.name}_lpips_plot.png
  train_val_loss_plot: ${dir.output}/${model.name}_train_val_loss_plot.png
  grad_norm_plot: ${dir.output}/${model.name}_grad_norm_plot.png
  hicrep_val_plot: ${dir.output}/${model.name}_hicrep_plot.png
  ent3c_val_plot: ${dir.output}/${model.name}_ent3c_plot.png
  lr_plot: ${dir.output}/${model.name}_lr_plot.png
  log: ${dir.output}/${model.name}.log

data:
  patch: 128
  interpolator_images_map:
    frame_0: img1.npy
    frame_1: img2.npy
    frame_2: img3.npy
  train_val_test_ratio: [0.9, 0.1, 0.0]
  batch_size: 6

training:
  epochs: 300
  restart_every: 100
  save_every: 10
  init_lr: 1e-4
  min_lr: 1e-6
  decay_steps: 100
  decay_rate: 0.215
  lr_staircase: true

model:
  name: hicinterpolate_curriculum_${data.patch}
  init_in_channels: 1
  init_out_channels: 4
  pyramid_level: 4
  ext_feature_level: 3
  unique_levels: 2
  flow:
    num_of_convs: [7, 5, 7]
    out_channels: [16, 32, 64]
  fusion_pyramid_level: 4

loss:
  # CURRICULUM LEARNING SCHEDULE
  # Epochs 0-10: Stabilize with reconstruction + symmetry
  # Epochs 10-20: Add perceptual loss + introduce mask supervision
  # Epochs 20-50: Ramp up mask losses + add Dice for sparsity
  # Epochs 50+: Full multi-task loss
  weight_parameters:
    # Primary reconstruction loss (starts high, decreases)
    - name: mse
      boundaries: [10, 50, 300]
      values: [1.0, 0.8, 0.5]
    
    # SSIM structural similarity (ramps up)
    - name: ssim
      boundaries: [10, 50, 300]
      values: [0.3, 0.6, 0.8]
    
    # Symmetry enforcement (high throughout)
    - name: symmetry
      boundaries: [300]
      values: [1.0, 1.0]
    
    # VGG perceptual loss (LOW weight due to domain mismatch with genomic data)
    # Consider disabling if causes instability (set first value to 0)
    - name: vgg
      boundaries: [50, 300]
      values: [0.0, 0.002]
    
    # Total Variation for smoothness (optional)
    - name: tv
      boundaries: [300]
      values: [0.05, 0.05]
    
    # Binary Cross Entropy for mask (starts late)
    - name: bce
      boundaries: [20, 300]
      values: [0.0, 0.5]
    
    # Dice Loss for mask head (better for class imbalance, starts late)
    # Directly optimizes IoU; aligns with SCC/HiCRep metrics
    - name: dice
      boundaries: [20, 300]
      values: [0.0, 0.3]
    
    # Stratified loss: distance-weighted for Hi-C diagonal structure
    - name: stratified
      boundaries: [10, 300]
      values: [0.0, 0.3]
    
    # Distance-weighted Adaptive Wing Loss (starts late)
    - name: distance_awl
      boundaries: [50, 300]
      values: [0.0, 0.2]

