  val_metrics: ${dir.output}/${model.name}_p${data.patch}_b${data.batch_size}_val_metrics.csv
  psnr_val_plot: ${dir.output}/${model.name}_p${data.patch}_b${data.batch_size}_psnr_plot.png
  ssim_val_plot: ${dir.output}/${model.name}_p${data.patch}_b${data.batch_size}_ssim_plot.png
  scc_val_plot: ${dir.output}/${model.name}_p${data.patch}_b${data.batch_size}_scc_plot.png
  hicrep_val_plot: ${dir.output}/${model.name}_p${data.patch}_b${data.batch_size}_hicrep_plot.png
  genome_disco_val_plot: ${dir.output}/${model.name}_p${data.patch}_b${data.batch_size}_genome_disco_plot.png
  lpips_val_plot: ${dir.output}/${model.name}_p${data.patch}_b${data.batch_size}_lpips_plot.png
  train_val_loss_plot: ${dir.output}/${model.name}_p${data.patch}_b${data.batch_size}_train_val_loss_plot.png
  lr_plot: ${dir.output}/${model.name}_p${data.patch}_b${data.batch_size}_lr_plot.png
  log: ${dir.output}/${model.name}_p${data.patch}_b${data.batch_size}.log
  val_metrics_plot: ${dir.output}/${model.name}_p${data.patch}_b${data.batch_size}_val_metrics.png

data:
  patch: 512
  batch_size: 20
  interpolator_images_map:
    frame_0: img1.npy
    frame_1: img2.npy
    frame_2: img3.npy
  train_val_test_ratio: [0.9, 0.1, 0.0]

training:
  epochs: 100
  save_every: 10
  lr: 1e-4
  min_lr: 1e-5
  weight_decay: 5e-5
  warmup_epochs: 3
  grad_clip: 1.0

model:
  name: hicinterpolate_${data.patch}
  init_in_channels: 1
  init_out_channels: 4
  pyramid_level: 4
  ext_feature_level: 3
  unique_levels: 2
  flow:
    num_of_convs: [7, 5, 7]
    out_channels: [16, 32, 64]
  fusion_pyramid_level: 4
  diffusion:
    enabled: false
    timesteps: 64
    beta_start: 0.0001
    beta_end: 0.02
    hidden_channels: 32
    inference_timestep: 4
    preserve_input_support: true

loss:
  weight_parameters:
    - name: l1
      boundaries: [0]
      values: [1.0]
    - name: ssim
      boundaries: [0]
      values: [1.0]

evaluation:
  monitor: ssim
  metrics:
    psnr: true
    ssim: true
    scc: true
    hicrep: true
    genome_disco: true
    lpips: true
