device: cuda

dir:
  model_state: ./hicinterpolate/datasets/timeseries/output/hicinterpolate
  output: ./hicinterpolate/datasets/timeseries/output/hicinterpolate
  data: ./hicinterpolate/datasets/timeseries/new_triplets
  image: ./hicinterpolate/datasets/timeseries/new_triplets


file:
  dataset_dict: ./hicinterpolate/datasets/timeseries/new_triplets/train/10000_64
  snapshot: ${dir.model_state}/${model.name}_snapshot.pt
  model: ${dir.model_state}/${model.name}.pt
  test_hic_map: ${dir.output}/${model.name}_p${data.patch}_b${data.batch_size}_hic_map.jpg
  num_visualization_samples: 2
  val_metrics: ${dir.output}/${model.name}_p${data.patch}_b${data.batch_size}_val_metrics.csv
  psnr_val_plot: ${dir.output}/${model.name}_p${data.patch}_b${data.batch_size}_psnr_plot.png
  ssim_val_plot: ${dir.output}/${model.name}_p${data.patch}_b${data.batch_size}_ssim_plot.png
  hicrep_val_plot: ${dir.output}/${model.name}_p${data.patch}_b${data.batch_size}_hicrep_plot.png
  train_val_loss_plot: ${dir.output}/${model.name}_p${data.patch}_b${data.batch_size}_train_val_loss_plot.png
  lr_plot: ${dir.output}/${model.name}_p${data.patch}_b${data.batch_size}_lr_plot.png
  log: ${dir.output}/${model.name}_p${data.patch}_b${data.batch_size}.log

data:
  patch: 64
  resolution: 10000
  batch_size: 20
  interpolator_images_map:
    frame_0: img1.npy
    frame_1: img2.npy
    frame_2: img3.npy

training:
  epochs: 100
  save_every: 10
  lr: 1e-4
  min_lr: 1e-5
  weight_decay: 1e-3
  warmup_epochs: 3
  grad_clip: 1.0
  patience: 20
  dropout: 0.1

model:
  name: hicinterpolate_25000_64

loss:
  weight_parameters:
    - name: mse
      boundaries: [0]
      values: [1.0]
    - name: ssim
      boundaries: [0]
      values: [0.8]
    - name: symmetry
      boundaries: [0]
      values: [0.1]

evaluation:
  monitor: loss
  metrics:
    psnr: true
    ssim: true
    hicrep: true
