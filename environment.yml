name: hicinterpolate
channels:
  - pytorch
  - nvidia
  - rapidsai
  - conda-forge
  - defaults

dependencies:
  # =========================
  # CORE
  # =========================
  - python=3.10
  - pip

  # =========================
  # CUDA / PYTORCH STACK
  # =========================
  - pytorch=2.1.1
  - torchvision=0.16.1
  - torchaudio=2.1.1
  - pytorch-cuda=11.8

  # =========================
  # NUMPY STACK (PINNED FOR STABILITY)
  # =========================
  - numpy=1.26
  - scipy=1.10.1
  - pandas=2.2.3
  - scikit-learn=1.6.1
  - matplotlib=3.9.4
  - seaborn=0.13.2
  - networkx=3.2.1
  - tqdm=4.65.0

  # =========================
  # GPU ACCELERATED STACK
  # =========================
  - cupy=12.3.0
  # cugraph is intentionally omitted here because current RAPIDS builds
  # conflict with the pinned Python/CUDA stack in this environment.

  # =========================
  # R (optional but stable via conda)
  # =========================
  - r-base=4.1

  # =========================
  # PIP ONLY (LAST STEP)
  # =========================
  - pip:
      - -f https://data.pyg.org/whl/torch-2.1.0+cu118.html
      # PyG (must be pip)
      - torch-geometric==2.5.3
      - torch-scatter==2.1.2
      - torch-sparse==0.6.18
      - torch-cluster==1.6.3
      - torch-spline-conv==1.2.2

      # ML / research tools
      - torchmetrics==1.7.1
      - omegaconf==2.3.0
      - wandb
      - lpips
      - cooler
      - gensim
      - fastdtw